# Onboard RGB on the left XIAO. The status blinker is linked only on this
# half. gpio-leds is the driver; LED_GPIO turns on when LED is enabled and
# the board node is present.
CONFIG_LED=y
CONFIG_LED_GPIO=y

# Host Caps Lock lives in the HID indicator report. The tracker is off
# unless this is set, and the status LED reads it.
CONFIG_ZMK_HID_INDICATORS=y
