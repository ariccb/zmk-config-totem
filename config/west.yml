# Adaptive keys, the Mac/Windows shortcut listener, autocorrect, quopostrokey,
# exponential backspace, and the status LED are an in-tree Zephyr module
# (config/zephyr/module.yml), not a separate west project.
# config/ is already this manifest's self path.
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
  self:
    path: config
