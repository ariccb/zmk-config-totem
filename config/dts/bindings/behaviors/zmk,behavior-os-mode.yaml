# SPDX-License-Identifier: MIT

description: |
  Mac/Windows shortcut mode, and the shortcuts that pick a finished chord
  per OS (redo, clipboard history, browser back and forward,
  current-app windows, the app switcher, Command+Alt,
  previous/next tab, select word, select line, and Cmd/Ctrl+Enter).

compatible: "zmk,behavior-os-mode"

include: zero_param.yaml

properties:
  command:
    type: string
    required: true
    enum:
      - "mac"
      - "win"
      - "redo"
      - "clip"
      - "fwd"
      - "back"
      - "fwd_br"
      - "apps"
      - "switch"
      - "galt"
      - "tab_prev"
      - "tab_next"
      - "selword"
      - "selline"
      - "enter"
