# In-tree behaviors compiled with this config: adaptive keys, the
# Mac/Windows shortcut listener, and the autocorrect trie.
# dts/bindings is picked up automatically. dts_root is intentionally unset:
# this directory is already the ZMK config root, and a second dts root would
# scan the Totem shield twice.
name: totem_adaptive_key
build:
  cmake: .
  kconfig: Kconfig
