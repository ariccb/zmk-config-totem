CONFIG_ZMK_USB_LOGGING=n

# Pointing stays on so the HID report matches the firmware that already
# shipped mouse keys. Lower does not bind move, scroll, or clicks.
# Hosts that paired before pointing was enabled still need to forget
# the keyboard and pair again.
CONFIG_ZMK_POINTING=y

# html_img queues about 230 press/release events at once. The default of 64
# would drop the tail of that macro, and of html_href and the arrow snippet.
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=320

# Windows is the shortcut default (Ctrl where the keymap says Cmd). A fresh
# board boots this way. After the Mac or Windows key on the System layer is
# pressed once, the saved choice wins over this setting.
CONFIG_TOTEM_OS_MODE_DEFAULT_WINDOWS=y
