CONFIG_ZMK_USB_LOGGING=n

# Raise uses mouse move, scroll, and clicks. This changes the HID report,
# so hosts that already paired this keyboard need to forget it and pair again.
CONFIG_ZMK_POINTING=y

# html_img queues about 230 press/release events at once. The default of 64
# would drop the tail of that macro, and of html_href and the arrow snippet.
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=320

# Mac is the shortcut default. Uncomment to make a fresh board boot in
# Windows mode (Ctrl where the keymap says Cmd). After the Mac or Windows
# key on the System layer is pressed once, the saved choice wins over this.
# CONFIG_TOTEM_OS_MODE_DEFAULT_WINDOWS=y
